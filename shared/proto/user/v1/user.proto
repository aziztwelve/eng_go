syntax = "proto3";

package user.v1;

option go_package = "github.com/elearning/shared/pkg/proto/user/v1;userv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// UserService предоставляет методы для управления профилями пользователей
service UserService {
  // GetProfile получает профиль пользователя
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  
  // UpdateProfile обновляет профиль пользователя
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  
  // GetUserLanguages получает языковые настройки пользователя
  rpc GetUserLanguages(GetUserLanguagesRequest) returns (GetUserLanguagesResponse);

  // BatchGetProfiles возвращает профили нескольких пользователей по списку
  // user_id. Используется leaderboard в social-service для enrichment
  // (avatar, full_name). Не-существующие user_id просто пропускаются.
  rpc BatchGetProfiles(BatchGetProfilesRequest) returns (BatchGetProfilesResponse);

  // Admin methods
  // ListUsers возвращает список всех пользователей (admin only)
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  
  // GetUser получает информацию о пользователе по ID (admin only)
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  
  // UpdateUser обновляет информацию о пользователе (admin only)
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  
  // DeleteUser удаляет пользователя (admin only)
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // === Onboarding (см. docs/tasks/onboarding-spec.md §3.1) ===
  // Эти методы — wrappers поверх profile-таблицы. Onboarding-поля
  // (proficiency_level, daily_goal_xp, motivation, signup_source,
  // placement_score, onboarded_at) хранятся в той же таблице profiles
  // рядом с native_lang/target_lang/date_of_birth.

  // GetOnboardingState — read текущего состояния онбординга юзера.
  rpc GetOnboardingState(GetOnboardingStateRequest) returns (GetOnboardingStateResponse);

  // PatchOnboardingState — partial update (любое поле может быть nil).
  // Вызывается клиентом после каждого шага онбординга.
  rpc PatchOnboardingState(PatchOnboardingStateRequest) returns (PatchOnboardingStateResponse);

  // CompleteOnboarding — финальный шаг, ставит onboarded_at = NOW().
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (CompleteOnboardingResponse);
}

// Profile представляет профиль пользователя
message Profile {
  string id = 1;
  string user_id = 2;
  google.protobuf.StringValue first_name = 3;
  google.protobuf.StringValue last_name = 4;
  google.protobuf.StringValue native_lang = 5;
  google.protobuf.StringValue target_lang = 6;
  google.protobuf.StringValue bio = 7;
  google.protobuf.StringValue avatar_url = 8;
  google.protobuf.StringValue date_of_birth = 9;
  google.protobuf.StringValue timezone = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

// GetProfileRequest содержит ID пользователя
message GetProfileRequest {
  string user_id = 1;
}

// GetProfileResponse содержит профиль пользователя
message GetProfileResponse {
  Profile profile = 1;
}

// UpdateProfileRequest содержит данные для обновления профиля
message UpdateProfileRequest {
  string user_id = 1;
  google.protobuf.StringValue first_name = 2;
  google.protobuf.StringValue last_name = 3;
  google.protobuf.StringValue native_lang = 4;
  google.protobuf.StringValue target_lang = 5;
  google.protobuf.StringValue bio = 6;
  google.protobuf.StringValue avatar_url = 7;
  google.protobuf.StringValue date_of_birth = 8;
  google.protobuf.StringValue timezone = 9;
}

// UpdateProfileResponse содержит обновленный профиль
message UpdateProfileResponse {
  Profile profile = 1;
}

// GetUserLanguagesRequest содержит ID пользователя
message GetUserLanguagesRequest {
  string user_id = 1;
}

// GetUserLanguagesResponse содержит языковые настройки
message GetUserLanguagesResponse {
  string native_lang = 1;
  string target_lang = 2;
}

// BatchGetProfilesRequest — список user_id для enrichment.
message BatchGetProfilesRequest {
  repeated string user_ids = 1;
}

// BatchGetProfilesResponse — карта user_id → Profile.
// Не-существующие user_id опускаются (без ошибки).
message BatchGetProfilesResponse {
  map<string, Profile> profiles = 1;
}

// User представляет пользователя системы
message User {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// ListUsersRequest запрос на получение списка пользователей
message ListUsersRequest {}

// ListUsersResponse ответ со списком пользователей
message ListUsersResponse {
  repeated User users = 1;
}

// GetUserRequest запрос на получение пользователя
message GetUserRequest {
  string user_id = 1;
}

// GetUserResponse ответ с информацией о пользователе
message GetUserResponse {
  User user = 1;
}

// UpdateUserRequest запрос на обновление пользователя
message UpdateUserRequest {
  string user_id = 1;
  string full_name = 2;
  string role = 3;
}

// UpdateUserResponse ответ с обновленным пользователем
message UpdateUserResponse {
  User user = 1;
}

// DeleteUserRequest запрос на удаление пользователя
message DeleteUserRequest {
  string user_id = 1;
}

// DeleteUserResponse ответ на удаление пользователя
message DeleteUserResponse {
  bool success = 1;
}

// === Onboarding (см. docs/tasks/onboarding-spec.md §3.1) ===

// OnboardingState — combined state онбординга юзера, читается из profiles.
message OnboardingState {
  string user_id = 1;
  google.protobuf.StringValue native_language    = 2;  // 'ru' | 'en' | ...
  google.protobuf.StringValue target_language    = 3;
  google.protobuf.StringValue proficiency_level  = 4;  // 'beginner'..'b2'|'just_for_fun'
  google.protobuf.Int32Value  daily_goal_xp      = 5;  // 10/20/30/50
  repeated string             motivation         = 6;  // ['travel','work',...]
  google.protobuf.StringValue signup_source      = 7;  // 'tiktok'|'friend'|...
  google.protobuf.Int32Value  placement_score    = 8;  // 0..5
  google.protobuf.StringValue date_of_birth      = 9;  // ISO date
  google.protobuf.Timestamp   onboarded_at       = 10;
  bool                        completed          = 11; // == onboarded_at != null

  // === Onboarding v3 (Oki-style) ===
  // См. docs/tasks/mob/onboarding-v3-oki-style.md §2.1.
  google.protobuf.StringValue age_bracket           = 12; // '7-12'|'13-17'|...|'55+'
  google.protobuf.Int32Value  daily_commit_minutes  = 13; // 5|10|15|25
  google.protobuf.StringValue pain_point            = 14; // 'fear_speaking'|'lack_vocab'|...
  google.protobuf.StringValue speaking_situation    = 15; // 'freeze'|'translate_in_head'|...
  google.protobuf.StringValue past_blocker          = 16; // 'boring'|'too_hard'|...
  google.protobuf.StringValue future_regret         = 17; // 'stay_same'|'limit_self'|...
  google.protobuf.StringValue emotional_reaction    = 18; // 'lose_confidence'|'upset'|...
  google.protobuf.StringValue reminder_slot         = 19; // 'morning'|'day'|'evening'|'flex'
  google.protobuf.Timestamp   paywall_seen_at       = 20;
  google.protobuf.StringValue paywall_choice        = 21; // 'annual'|'monthly'|'dismissed'|'special_offer'
}

// GetOnboardingStateRequest — юзер из контекста.
message GetOnboardingStateRequest {
  string user_id = 1;
}

// GetOnboardingStateResponse — current state.
message GetOnboardingStateResponse {
  OnboardingState state = 1;
}

// PatchOnboardingStateRequest — partial update.
// Любое не-nil поле перезаписывает текущее значение в БД. nil — оставляет
// как есть. Поле motivation особое — используется motivation_set, чтобы
// отличить «не передавали» от «явно очистили в []».
message PatchOnboardingStateRequest {
  string user_id = 1;

  google.protobuf.StringValue native_language    = 2;
  google.protobuf.StringValue target_language    = 3;
  google.protobuf.StringValue proficiency_level  = 4;
  google.protobuf.Int32Value  daily_goal_xp      = 5;

  // motivation: repeated → replace целиком (не append).
  // motivation_set=false → не трогаем колонку.
  // motivation_set=true  → пишем motivation (даже если пусто).
  repeated string motivation         = 6;
  bool            motivation_set     = 7;

  google.protobuf.StringValue signup_source      = 8;
  google.protobuf.Int32Value  placement_score    = 9;
  google.protobuf.StringValue date_of_birth      = 10;

  // === Onboarding v3 (Oki-style) — все nullable для partial-update ===
  google.protobuf.StringValue age_bracket           = 11;
  google.protobuf.Int32Value  daily_commit_minutes  = 12;
  google.protobuf.StringValue pain_point            = 13;
  google.protobuf.StringValue speaking_situation    = 14;
  google.protobuf.StringValue past_blocker          = 15;
  google.protobuf.StringValue future_regret         = 16;
  google.protobuf.StringValue emotional_reaction    = 17;
  google.protobuf.StringValue reminder_slot         = 18;
  google.protobuf.Timestamp   paywall_seen_at       = 19;
  google.protobuf.StringValue paywall_choice        = 20;
}

// PatchOnboardingStateResponse — обновлённый state.
message PatchOnboardingStateResponse {
  OnboardingState state = 1;
}

// CompleteOnboardingRequest — финальный шаг.
message CompleteOnboardingRequest {
  string user_id = 1;
}

// CompleteOnboardingResponse — обновлённый state с onboarded_at.
message CompleteOnboardingResponse {
  OnboardingState state = 1;
}
