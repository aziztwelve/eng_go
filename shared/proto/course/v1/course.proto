syntax = "proto3";

package course.v1;

option go_package = "github.com/elearning/shared/pkg/proto/course/v1;coursev1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "gamification/v1/gamification.proto";

// CourseService предоставляет методы для управления курсами
service CourseService {
  // Student endpoints
  // ListCourses получает список курсов с фильтрацией
  rpc ListCourses(ListCoursesRequest) returns (ListCoursesResponse);
  
  // GetCourse получает детальную информацию о курсе
  rpc GetCourse(GetCourseRequest) returns (GetCourseResponse);
  
  // GetLesson получает информацию об уроке
  rpc GetLesson(GetLessonRequest) returns (GetLessonResponse);
  
  // GetStepContent получает содержимое шага
  rpc GetStepContent(GetStepContentRequest) returns (GetStepContentResponse);
  
  // EnrollUser записывает пользователя на курс
  rpc EnrollUser(EnrollUserRequest) returns (EnrollUserResponse);
  
  // CheckAccess проверяет доступ пользователя к курсу
  rpc CheckAccess(CheckAccessRequest) returns (CheckAccessResponse);
  
  // Admin endpoints
  // CreateCourse создает новый курс
  rpc CreateCourse(CreateCourseRequest) returns (CreateCourseResponse);
  
  // UpdateCourse обновляет курс
  rpc UpdateCourse(UpdateCourseRequest) returns (UpdateCourseResponse);
  
  // DeleteCourse удаляет курс
  rpc DeleteCourse(DeleteCourseRequest) returns (DeleteCourseResponse);
  
  // PublishCourse публикует/снимает с публикации курс
  rpc PublishCourse(PublishCourseRequest) returns (PublishCourseResponse);
  
  // CreateModule создает новый модуль
  rpc CreateModule(CreateModuleRequest) returns (CreateModuleResponse);
  
  // UpdateModule обновляет модуль
  rpc UpdateModule(UpdateModuleRequest) returns (UpdateModuleResponse);
  
  // DeleteModule удаляет модуль
  rpc DeleteModule(DeleteModuleRequest) returns (DeleteModuleResponse);
  
  // CreateLesson создает новый урок
  rpc CreateLesson(CreateLessonRequest) returns (CreateLessonResponse);
  
  // UpdateLesson обновляет урок
  rpc UpdateLesson(UpdateLessonRequest) returns (UpdateLessonResponse);
  
  // DeleteLesson удаляет урок
  rpc DeleteLesson(DeleteLessonRequest) returns (DeleteLessonResponse);
  
  // CreateStep создает новый шаг
  rpc CreateStep(CreateStepRequest) returns (CreateStepResponse);
  
  // UpdateStep обновляет шаг
  rpc UpdateStep(UpdateStepRequest) returns (UpdateStepResponse);
  
  // DeleteStep удаляет шаг
  rpc DeleteStep(DeleteStepRequest) returns (DeleteStepResponse);
  
  // Progress tracking
  // MarkStepComplete отмечает шаг как завершенный
  rpc MarkStepComplete(MarkStepCompleteRequest) returns (MarkStepCompleteResponse);
  
  // GetStepProgress получает прогресс по шагу
  rpc GetStepProgress(GetStepProgressRequest) returns (GetStepProgressResponse);
  
  // GetLessonProgress получает прогресс по уроку
  rpc GetLessonProgress(GetLessonProgressRequest) returns (GetLessonProgressResponse);
  
  // GetCourseProgress получает прогресс по курсу
  rpc GetCourseProgress(GetCourseProgressRequest) returns (GetCourseProgressResponse);

  // === Learning Tracks (Phase 0 — standalone content) ===
  // ListTracks возвращает страницу треков
  rpc ListTracks(ListTracksRequest) returns (ListTracksResponse);

  // GetTrack возвращает трек по ID
  rpc GetTrack(GetTrackRequest) returns (GetTrackResponse);

  // GetTrackByCode возвращает трек по уникальному коду (для frontend deeplinks)
  rpc GetTrackByCode(GetTrackByCodeRequest) returns (GetTrackResponse);

  // CreateTrack создаёт новый трек
  rpc CreateTrack(CreateTrackRequest) returns (CreateTrackResponse);

  // UpdateTrack обновляет трек
  rpc UpdateTrack(UpdateTrackRequest) returns (UpdateTrackResponse);

  // DeleteTrack удаляет трек (lessons остаются, связи каскадно)
  rpc DeleteTrack(DeleteTrackRequest) returns (DeleteTrackResponse);

  // PublishTrack публикует/снимает с публикации
  rpc PublishTrack(PublishTrackRequest) returns (PublishTrackResponse);

  // AddLessonToTrack привязывает урок (включая standalone) к треку
  rpc AddLessonToTrack(AddLessonToTrackRequest) returns (AddLessonToTrackResponse);

  // RemoveLessonFromTrack отвязывает урок от трека
  rpc RemoveLessonFromTrack(RemoveLessonFromTrackRequest) returns (RemoveLessonFromTrackResponse);

  // ReorderTrackLessons атомарно переустанавливает порядок уроков в треке
  rpc ReorderTrackLessons(ReorderTrackLessonsRequest) returns (ReorderTrackLessonsResponse);

  // === Vocabulary (Phase 2) ===
  // Словарь — слова с переводами для match_pairs / fill_blank / listening.
  rpc ListVocabulary(ListVocabularyRequest) returns (ListVocabularyResponse);
  rpc GetVocabularyEntry(GetVocabularyEntryRequest) returns (GetVocabularyEntryResponse);
  rpc CreateVocabularyEntry(CreateVocabularyEntryRequest) returns (CreateVocabularyEntryResponse);
  rpc UpdateVocabularyEntry(UpdateVocabularyEntryRequest) returns (UpdateVocabularyEntryResponse);
  rpc DeleteVocabularyEntry(DeleteVocabularyEntryRequest) returns (DeleteVocabularyEntryResponse);
  rpc BulkCreateVocabulary(BulkCreateVocabularyRequest) returns (BulkCreateVocabularyResponse);

  // === TTS (Phase 2 — stub) ===
  // На phase-2 SynthesizeTTS сохраняет переданный audio_url в кэш
  // (без вызова TTS-провайдера). GetTTSByText читает из кэша.
  // Реальная интеграция с Google Cloud TTS / ElevenLabs — Phase 5.
  rpc SynthesizeTTS(SynthesizeTTSRequest) returns (SynthesizeTTSResponse);
  rpc GetTTSByText(GetTTSByTextRequest) returns (GetTTSByTextResponse);

  // === Flashcards (Phase 7 — повтор слов) ===
  // Личные карточки слов пользователя для feature "Повтор слов".
  // См. docs/tasks/phase-7-word-flashcards.md.
  rpc ListFlashcards(ListFlashcardsRequest) returns (ListFlashcardsResponse);
  rpc GetFlashcard(GetFlashcardRequest) returns (GetFlashcardResponse);
  rpc CreateFlashcard(CreateFlashcardRequest) returns (CreateFlashcardResponse);
  rpc UpdateFlashcard(UpdateFlashcardRequest) returns (UpdateFlashcardResponse);
  rpc ArchiveFlashcard(ArchiveFlashcardRequest) returns (ArchiveFlashcardResponse);
  rpc BulkCreateFlashcards(BulkCreateFlashcardsRequest) returns (BulkCreateFlashcardsResponse);
  rpc AddVocabularyAsFlashcard(AddVocabularyAsFlashcardRequest) returns (AddVocabularyAsFlashcardResponse);
  rpc GetFlashcardStats(GetFlashcardStatsRequest) returns (GetFlashcardStatsResponse);

  // === Today queue (Phase 7) ===
  // Priority queue "На сегодня" — карточки запинаны юзером для
  // обязательной practice-сессии сегодня.
  rpc PinForToday(PinForTodayRequest) returns (PinForTodayResponse);
  rpc UnpinFromToday(UnpinFromTodayRequest) returns (UnpinFromTodayResponse);
  rpc ListTodayQueue(ListTodayQueueRequest) returns (ListTodayQueueResponse);
}

// Course представляет курс
message Course {
  string id = 1;
  string title = 2;
  string description = 3;
  double price = 4;
  string instructor_id = 5;
  string level = 6;
  string language = 7;
  string thumbnail_url = 8;
  bool is_published = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Module представляет модуль курса
message Module {
  string id = 1;
  string course_id = 2;
  string title = 3;
  string description = 4;
  int32 order_index = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Lesson представляет урок
message Lesson {
  string id = 1;
  string module_id = 2;
  string title = 3;
  string description = 4;
  int32 order_index = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// Step представляет атомарную единицу контента
message Step {
  string id = 1;
  string lesson_id = 2;
  // Phase 0 legacy: video, text, quiz, task, brain_game, ai_writing.
  // Phase 2: translate, match_pairs, listening, fill_blank, tap_words, story.
  // Структура `content` зависит от типа — см. docs/tasks/phase-2-step-formats.md.
  string type = 3;
  string title = 4;
  string content = 5; // JSON string
  int32 order_index = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Enrollment представляет запись на курс
message Enrollment {
  string id = 1;
  string user_id = 2;
  string course_id = 3;
  string status = 4;
  google.protobuf.Timestamp enrolled_at = 5;
  google.protobuf.Timestamp access_until = 6;
}

// ModuleWithLessons содержит модуль с уроками
message ModuleWithLessons {
  Module module = 1;
  repeated LessonWithSteps lessons = 2;
}

// LessonWithSteps содержит урок с шагами
message LessonWithSteps {
  Lesson lesson = 1;
  repeated Step steps = 2;
}

// ListCoursesRequest содержит параметры фильтрации
message ListCoursesRequest {
  google.protobuf.StringValue language = 1;
  google.protobuf.StringValue level = 2;
  google.protobuf.DoubleValue min_price = 3;
  google.protobuf.DoubleValue max_price = 4;
  int32 limit = 5;
  int32 offset = 6;
  bool include_unpublished = 7; // For admin: show all courses including drafts
  string search = 8; // Search by title or description
  string status = 9; // Filter by status: "draft" or "published"
}

// ListCoursesResponse содержит список курсов
message ListCoursesResponse {
  repeated Course courses = 1;
  int32 total = 2;
}

// GetCourseRequest содержит ID курса
message GetCourseRequest {
  string course_id = 1;
}

// GetCourseResponse содержит курс с модулями
message GetCourseResponse {
  Course course = 1;
  repeated ModuleWithLessons modules = 2;
}

// GetLessonRequest содержит ID урока
message GetLessonRequest {
  string lesson_id = 1;
}

// GetLessonResponse содержит урок
message GetLessonResponse {
  Lesson lesson = 1;
  repeated Step steps = 2;
}

// GetStepContentRequest содержит данные для получения шага
message GetStepContentRequest {
  string step_id = 1;
  string user_id = 2;
}

// GetStepContentResponse содержит шаг с дополнительными данными
message GetStepContentResponse {
  Step step = 1;
  string video_url = 2; // Заполняется если type=video
}

// EnrollUserRequest содержит данные для записи на курс
message EnrollUserRequest {
  string user_id = 1;
  string course_id = 2;
}

// EnrollUserResponse содержит информацию о записи
message EnrollUserResponse {
  Enrollment enrollment = 1;
}

// CheckAccessRequest содержит данные для проверки доступа
message CheckAccessRequest {
  string user_id = 1;
  string course_id = 2;
}

// CheckAccessResponse содержит результат проверки
message CheckAccessResponse {
  bool has_access = 1;
}

// Admin endpoints messages

// CreateCourseRequest содержит данные для создания курса
message CreateCourseRequest {
  string title = 1;
  string description = 2;
  double price = 3;
  string instructor_id = 4;
  string level = 5;
  string language = 6;
  string thumbnail_url = 7;
}

// CreateCourseResponse содержит созданный курс
message CreateCourseResponse {
  Course course = 1;
}

// UpdateCourseRequest содержит данные для обновления курса
message UpdateCourseRequest {
  string course_id = 1;
  google.protobuf.StringValue title = 2;
  google.protobuf.StringValue description = 3;
  google.protobuf.DoubleValue price = 4;
  google.protobuf.StringValue level = 5;
  google.protobuf.StringValue language = 6;
  google.protobuf.StringValue thumbnail_url = 7;
}

// UpdateCourseResponse содержит обновленный курс
message UpdateCourseResponse {
  Course course = 1;
}

// DeleteCourseRequest содержит ID курса для удаления
message DeleteCourseRequest {
  string course_id = 1;
}

// DeleteCourseResponse содержит результат удаления
message DeleteCourseResponse {
  bool success = 1;
}

// PublishCourseRequest содержит данные для публикации курса
message PublishCourseRequest {
  string course_id = 1;
  bool is_published = 2;
}

// PublishCourseResponse содержит обновленный курс
message PublishCourseResponse {
  Course course = 1;
}

// CreateModuleRequest содержит данные для создания модуля
message CreateModuleRequest {
  string course_id = 1;
  string title = 2;
  string description = 3;
  int32 order_index = 4;
}

// CreateModuleResponse содержит созданный модуль
message CreateModuleResponse {
  Module module = 1;
}

// UpdateModuleRequest содержит данные для обновления модуля
message UpdateModuleRequest {
  string module_id = 1;
  google.protobuf.StringValue title = 2;
  google.protobuf.StringValue description = 3;
  google.protobuf.Int32Value order_index = 4;
}

// UpdateModuleResponse содержит обновленный модуль
message UpdateModuleResponse {
  Module module = 1;
}

// DeleteModuleRequest содержит ID модуля для удаления
message DeleteModuleRequest {
  string module_id = 1;
}

// DeleteModuleResponse содержит результат удаления
message DeleteModuleResponse {
  bool success = 1;
}

// CreateLessonRequest содержит данные для создания урока
message CreateLessonRequest {
  string module_id = 1;
  string title = 2;
  string description = 3;
  int32 order_index = 4;
}

// CreateLessonResponse содержит созданный урок
message CreateLessonResponse {
  Lesson lesson = 1;
}

// UpdateLessonRequest содержит данные для обновления урока
message UpdateLessonRequest {
  string lesson_id = 1;
  google.protobuf.StringValue title = 2;
  google.protobuf.StringValue description = 3;
  google.protobuf.Int32Value order_index = 4;
}

// UpdateLessonResponse содержит обновленный урок
message UpdateLessonResponse {
  Lesson lesson = 1;
}

// DeleteLessonRequest содержит ID урока для удаления
message DeleteLessonRequest {
  string lesson_id = 1;
}

// DeleteLessonResponse содержит результат удаления
message DeleteLessonResponse {
  bool success = 1;
}

// CreateStepRequest содержит данные для создания шага
message CreateStepRequest {
  string lesson_id = 1;
  string type = 2;
  string title = 3;
  string content = 4; // JSON string
  int32 order_index = 5;
}

// CreateStepResponse содержит созданный шаг
message CreateStepResponse {
  Step step = 1;
}

// UpdateStepRequest содержит данные для обновления шага
message UpdateStepRequest {
  string step_id = 1;
  google.protobuf.StringValue type = 2;
  google.protobuf.StringValue title = 3;
  google.protobuf.StringValue content = 4;
  google.protobuf.Int32Value order_index = 5;
}

// UpdateStepResponse содержит обновленный шаг
message UpdateStepResponse {
  Step step = 1;
}

// DeleteStepRequest содержит ID шага для удаления
message DeleteStepRequest {
  string step_id = 1;
}

// DeleteStepResponse содержит результат удаления
message DeleteStepResponse {
  bool success = 1;
}

// Progress tracking messages

// StepProgress представляет прогресс по шагу
message StepProgress {
  string id = 1;
  string user_id = 2;
  string step_id = 3;
  string lesson_id = 4;
  bool completed = 5;
  google.protobuf.Timestamp completed_at = 6;
  int32 time_spent_seconds = 7;
  int32 attempts = 8;
  double score = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// LessonProgress представляет прогресс по уроку
message LessonProgress {
  string id = 1;
  string user_id = 2;
  string lesson_id = 3;
  string course_id = 4;
  int32 total_steps = 5;
  int32 completed_steps = 6;
  double progress_percentage = 7;
  google.protobuf.Timestamp started_at = 8;
  google.protobuf.Timestamp last_activity_at = 9;
  google.protobuf.Timestamp completed_at = 10;
}

// MarkStepCompleteRequest содержит данные для отметки шага как завершенного
message MarkStepCompleteRequest {
  string user_id = 1;
  string step_id = 2;
  int32 time_spent_seconds = 3;
  google.protobuf.Int32Value attempts = 4;
  google.protobuf.DoubleValue score = 5;
}

// MarkStepCompleteResponse содержит результат отметки шага
message MarkStepCompleteResponse {
  StepProgress step_progress = 1;
  LessonProgress lesson_progress = 2;
  // Опциональный gamification-payload, заполняется когда course-service
  // настроен на gamification-service (gRPC). Если клиент не настроен
  // или вызов упал — поле будет null/отсутствовать; фронт должен
  // gracefully degrade'ить (см. use-gamification-fx).
  gamification.v1.AddXPResponse gamification = 3;
}

// GetStepProgressRequest содержит данные для получения прогресса по шагу
message GetStepProgressRequest {
  string user_id = 1;
  string step_id = 2;
}

// GetStepProgressResponse содержит прогресс по шагу
message GetStepProgressResponse {
  StepProgress progress = 1;
  bool exists = 2;
}

// GetLessonProgressRequest содержит данные для получения прогресса по уроку
message GetLessonProgressRequest {
  string user_id = 1;
  string lesson_id = 2;
}

// GetLessonProgressResponse содержит прогресс по уроку
message GetLessonProgressResponse {
  LessonProgress progress = 1;
  repeated StepProgress step_progresses = 2;
}

// GetCourseProgressRequest содержит данные для получения прогресса по курсу
message GetCourseProgressRequest {
  string user_id = 1;
  string course_id = 2;
}

// GetCourseProgressResponse содержит прогресс по курсу
message GetCourseProgressResponse {
  repeated LessonProgress lesson_progresses = 1;
  int32 total_lessons = 2;
  int32 completed_lessons = 3;
  double overall_progress_percentage = 4;
}

// === Learning Tracks (Phase 0) ===

// Track — тематический трек для standalone уроков
message Track {
  string id = 1;
  string code = 2;
  string title = 3;
  string description = 4;
  string icon_url = 5;
  string language = 6;
  string level = 7;
  string track_type = 8; // thematic | daily | stories | podcast
  bool is_published = 9;
  int32 sort_order = 10;
  string created_by = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// TrackWithLessons — трек со списком уроков (в порядке order_index в track_lessons)
message TrackWithLessons {
  Track track = 1;
  repeated Lesson lessons = 2;
}

message ListTracksRequest {
  google.protobuf.StringValue language = 1;
  google.protobuf.StringValue level = 2;
  google.protobuf.StringValue track_type = 3;
  string search = 4;
  bool include_unpublished = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ListTracksResponse {
  repeated Track tracks = 1;
  int32 total = 2;
}

message GetTrackRequest {
  string track_id = 1;
  bool include_lessons = 2; // если true — возвращает уроки в порядке трека
}

message GetTrackByCodeRequest {
  string code = 1;
  bool include_lessons = 2;
}

message GetTrackResponse {
  Track track = 1;
  repeated Lesson lessons = 2; // пусто, если include_lessons=false
}

message CreateTrackRequest {
  string code = 1;
  string title = 2;
  string description = 3;
  string icon_url = 4;
  string language = 5;
  string level = 6;
  string track_type = 7;
  int32 sort_order = 8;
  string created_by = 9;
}

message CreateTrackResponse {
  Track track = 1;
}

message UpdateTrackRequest {
  string track_id = 1;
  google.protobuf.StringValue title = 2;
  google.protobuf.StringValue description = 3;
  google.protobuf.StringValue icon_url = 4;
  google.protobuf.StringValue language = 5;
  google.protobuf.StringValue level = 6;
  google.protobuf.StringValue track_type = 7;
  google.protobuf.Int32Value sort_order = 8;
}

message UpdateTrackResponse {
  Track track = 1;
}

message DeleteTrackRequest {
  string track_id = 1;
}

message DeleteTrackResponse {
  bool success = 1;
}

message PublishTrackRequest {
  string track_id = 1;
  bool is_published = 2;
}

message PublishTrackResponse {
  Track track = 1;
}

message AddLessonToTrackRequest {
  string track_id = 1;
  string lesson_id = 2;
  int32 order_index = 3;
}

message AddLessonToTrackResponse {
  bool success = 1;
}

message RemoveLessonFromTrackRequest {
  string track_id = 1;
  string lesson_id = 2;
}

message RemoveLessonFromTrackResponse {
  bool success = 1;
}

message ReorderTrackLessonsRequest {
  string track_id = 1;
  repeated string lesson_ids = 2; // новый порядок
}

message ReorderTrackLessonsResponse {
  bool success = 1;
}

// === Vocabulary (Phase 2) ===

// VocabularyEntry — пара слово↔перевод в словаре.
message VocabularyEntry {
  string id = 1;
  string language = 2;        // 'en', 'es', 'kk'
  string word = 3;
  string translation = 4;
  string target_language = 5; // язык перевода
  string audio_url = 6;       // optional
  string image_url = 7;       // optional
  string level = 8;           // A1 | A2 | B1 | ...
  string pos = 9;             // noun | verb | adj | ...
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message ListVocabularyRequest {
  google.protobuf.StringValue language = 1;
  google.protobuf.StringValue target_language = 2;
  google.protobuf.StringValue level = 3;
  google.protobuf.StringValue pos = 4;
  string search = 5;
  int32 limit = 6;
  int32 offset = 7;
}

message ListVocabularyResponse {
  repeated VocabularyEntry entries = 1;
  int32 total = 2;
}

message GetVocabularyEntryRequest {
  string id = 1;
}

message GetVocabularyEntryResponse {
  VocabularyEntry entry = 1;
}

message CreateVocabularyEntryRequest {
  string language = 1;
  string word = 2;
  string translation = 3;
  string target_language = 4;
  string audio_url = 5;
  string image_url = 6;
  string level = 7;
  string pos = 8;
}

message CreateVocabularyEntryResponse {
  VocabularyEntry entry = 1;
}

message UpdateVocabularyEntryRequest {
  string id = 1;
  google.protobuf.StringValue word = 2;
  google.protobuf.StringValue translation = 3;
  google.protobuf.StringValue audio_url = 4;
  google.protobuf.StringValue image_url = 5;
  google.protobuf.StringValue level = 6;
  google.protobuf.StringValue pos = 7;
}

message UpdateVocabularyEntryResponse {
  VocabularyEntry entry = 1;
}

message DeleteVocabularyEntryRequest {
  string id = 1;
}

message DeleteVocabularyEntryResponse {
  bool success = 1;
}

message BulkCreateVocabularyRequest {
  repeated CreateVocabularyEntryRequest entries = 1;
}

message BulkCreateVocabularyResponse {
  // ID-шники созданных записей в том же порядке, в котором пришли
  // в запрос. Дубликаты по uniq-ключу (language, word, target_language)
  // получают пустую строку.
  repeated string ids = 1;
  int32 created = 2;
  int32 skipped = 3;
}

// === TTS Cache (Phase 2 stub) ===

message TTSCacheEntry {
  string id = 1;
  string text = 2;
  string language = 3;
  string voice = 4;
  string audio_url = 5;
  int32 duration_ms = 6;
  google.protobuf.Timestamp created_at = 7;
}

// На phase-2 SynthesizeTTS не вызывает TTS-провайдер. Если передан
// `audio_url` — сохраняем его в кэш под (text, language, voice).
// Если не передан — возвращаем INVALID_ARGUMENT, т.к. провайдер ещё
// не подключён. В Phase 5 будет реальная синтез-логика.
message SynthesizeTTSRequest {
  string text = 1;
  string language = 2;
  string voice = 3;        // optional, default = "default"
  string audio_url = 4;    // обязательно для phase-2 stub
  int32 duration_ms = 5;   // optional
}

message SynthesizeTTSResponse {
  TTSCacheEntry entry = 1;
  bool created = 2; // false = взято из кэша
}

message GetTTSByTextRequest {
  string text = 1;
  string language = 2;
  string voice = 3; // optional, default = "default"
}

message GetTTSByTextResponse {
  TTSCacheEntry entry = 1;
}

// =====================================================================
// Phase 7: Flashcards + Today Queue
// =====================================================================

// Flashcard — личная карточка слова пользователя.
message Flashcard {
  string id              = 1;
  string user_id         = 2;
  // 'manual' | 'lesson' | 'mistake' | 'ai_suggestion'
  string source          = 3;
  // Optional: NULL для чисто manual карточек.
  string vocabulary_id   = 4;
  string word            = 5;
  string translation     = 6;
  string language        = 7;
  string target_language = 8;
  string definition       = 9;   // optional
  string example_sentence = 10;  // optional
  string audio_url       = 11;   // optional
  string image_url       = 12;   // optional
  google.protobuf.Timestamp archived_at = 13;
  google.protobuf.Timestamp created_at  = 14;
  google.protobuf.Timestamp updated_at  = 15;
  // Computed: запинана ли карточка на сегодня (см. flashcard_today_queue).
  bool   pinned_today    = 16;
  // Опциональная SM-2 проекция (вернётся, если caller просит include_srs).
  // Заполняется course-service'ом из srs-service (cross-svc вызов).
  optional double strength       = 17;
  optional int32  repetitions    = 18;
  optional google.protobuf.Timestamp next_review_at = 19;
}

// === ListFlashcards ===
message ListFlashcardsRequest {
  string user_id      = 1;
  // Фильтр по source: 'manual' | 'lesson' | 'mistake' | 'ai_suggestion'.
  // Empty = all sources.
  string source       = 2;
  // Если true — только запинанные на сегодня.
  bool   pinned_today = 3;
  // Поиск по lower(word). Empty = без фильтра.
  string search       = 4;
  // Если true — также возвращаем archived (для UI «корзина»).
  bool   include_archived = 5;
  // Если true — заполняем SM-2 поля (strength/repetitions/next_review_at).
  bool   include_srs  = 6;
  int32  limit        = 7;  // default 50, max 200
  int32  offset       = 8;
}

message ListFlashcardsResponse {
  repeated Flashcard items = 1;
  int32 total              = 2;
}

// === GetFlashcard ===
message GetFlashcardRequest {
  string user_id      = 1;
  string flashcard_id = 2;
  bool   include_srs  = 3;
}

message GetFlashcardResponse {
  Flashcard flashcard = 1;
}

// === CreateFlashcard ===
// Manual create: client передаёт word/translation/(definition/example).
// vocabulary_id не передаётся — карточка считается manual.
message CreateFlashcardRequest {
  string user_id          = 1;
  string word             = 2;
  string translation      = 3;
  string language         = 4;   // например 'en'
  string target_language  = 5;   // например 'ru'
  string definition       = 6;   // optional
  string example_sentence = 7;   // optional
  string audio_url        = 8;   // optional
  string image_url        = 9;   // optional
}

message CreateFlashcardResponse {
  Flashcard flashcard = 1;
}

// === UpdateFlashcard ===
// Partial update — только non-empty значения применяются.
message UpdateFlashcardRequest {
  string user_id      = 1;
  string flashcard_id = 2;
  google.protobuf.StringValue word             = 3;
  google.protobuf.StringValue translation      = 4;
  google.protobuf.StringValue definition       = 5;
  google.protobuf.StringValue example_sentence = 6;
  google.protobuf.StringValue audio_url        = 7;
  google.protobuf.StringValue image_url        = 8;
}

message UpdateFlashcardResponse {
  Flashcard flashcard = 1;
}

// === ArchiveFlashcard ===
// Soft-delete (set archived_at = NOW()).
message ArchiveFlashcardRequest {
  string user_id      = 1;
  string flashcard_id = 2;
}

message ArchiveFlashcardResponse {}

// === BulkCreateFlashcards ===
// Для accept-all из AI suggestions либо batch-import.
message BulkCreateFlashcardsRequest {
  string user_id = 1;
  message Item {
    string word             = 1;
    string translation      = 2;
    string language         = 3;
    string target_language  = 4;
    string definition       = 5;
    string example_sentence = 6;
    string source           = 7; // default 'manual'
    string vocabulary_id    = 8; // optional, если ref на system vocab
  }
  repeated Item items = 2;
}

message BulkCreateFlashcardsResponse {
  int32 created_count = 1;
  int32 skipped_count = 2; // дубликаты (vocabulary_id уже есть)
  repeated Flashcard items = 3;
}

// === AddVocabularyAsFlashcard ===
// Дёргается step-validation-service'ом при auto-add из урока, либо
// клиентом при выборе слова из catalog.
message AddVocabularyAsFlashcardRequest {
  string user_id       = 1;
  string vocabulary_id = 2;
  // 'lesson' | 'mistake' | 'ai_suggestion' (не 'manual', т.к. ref на vocab).
  string source        = 3;
}

message AddVocabularyAsFlashcardResponse {
  Flashcard flashcard = 1;
  // false если карточка с таким vocabulary_id уже существовала.
  bool created = 2;
}

// === GetFlashcardStats ===
// Stats для UI tile блока в Library экране.
message GetFlashcardStatsRequest {
  string user_id = 1;
}

message GetFlashcardStatsResponse {
  // Карточек, у которых next_review_at <= now() OR pinned_today.
  int32 today_due       = 1;
  // Из today_due — сколько уже отревьювлено сегодня.
  int32 today_completed = 2;
  // Карточек reps>0 && strength<0.8.
  int32 learning_count  = 3;
  // Карточек strength>=0.8.
  int32 mastered_count  = 4;
  // Total non-archived карточек.
  int32 total_count     = 5;
}

// === Today Queue ===
message PinForTodayRequest {
  string user_id      = 1;
  string flashcard_id = 2;
  // Дата в timezone юзера (YYYY-MM-DD). Empty → сервер сам считает.
  string queued_for_date = 3;
}

message PinForTodayResponse {
  // Когда карточка запиннута (для UI feedback).
  google.protobuf.Timestamp added_at = 1;
}

message UnpinFromTodayRequest {
  string user_id      = 1;
  string flashcard_id = 2;
  string queued_for_date = 3; // optional — empty значит "сегодня"
}

message UnpinFromTodayResponse {}

message ListTodayQueueRequest {
  string user_id = 1;
  // Empty → "сегодня" в timezone юзера.
  string queued_for_date = 2;
  bool   include_srs = 3;
}

message ListTodayQueueResponse {
  repeated Flashcard items = 1;
  // Дата, для которой вернули список (фактическая, после авто-вычисления).
  string queued_for_date = 2;
}
