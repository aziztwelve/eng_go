syntax = "proto3";

package auth.v1;

option go_package = "github.com/elearning/shared/pkg/proto/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

// AuthService предоставляет методы для аутентификации и авторизации
service AuthService {
  // Register регистрирует нового пользователя
  rpc Register(RegisterRequest) returns (RegisterResponse);
  
  // Login выполняет вход пользователя
  rpc Login(LoginRequest) returns (LoginResponse);
  
  // ValidateToken проверяет валидность токена
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // RefreshToken обновляет access token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  
  // GetUserInfo получает информацию о пользователе по ID
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  
  // ListUsers возвращает список всех пользователей (admin)
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  
  // UpdateUserRole обновляет роль пользователя (admin)
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse);
  
  // DeleteUser удаляет пользователя (admin)
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // SearchByUsername ищет пользователей по префиксу username (ILIKE).
  // Используется для friend-search (Phase 4.5). Public RPC (без admin).
  rpc SearchByUsername(SearchByUsernameRequest) returns (SearchByUsernameResponse);

  // CreateGuestSession создаёт анонимного пользователя (is_guest=true) и
  // выдаёт JWT. Используется на bootstrap mobile/web до прохождения
  // онбординга. См. docs/tasks/onboarding-spec.md §3.2.
  // Идемпотентен по device_id: повторный вызов с тем же device_id
  // возвращает того же гостя.
  rpc CreateGuestSession(CreateGuestSessionRequest) returns (CreateGuestSessionResponse);

  // ClaimGuestAccount переводит гостя в полноценного юзера, сохраняя
  // user_id (XP/streak/SRS гостя автоматически принадлежат ему уже).
  // Caller обязан быть гостем (is_guest=true в JWT). После успеха
  // user.is_guest = false, появляются email/password/username.
  rpc ClaimGuestAccount(ClaimGuestAccountRequest) returns (ClaimGuestAccountResponse);

  // CleanupExpiredGuests удаляет гостей старше cutoff_days (default 90).
  // Используется cron'ом auth-service. Cascade удалит все downstream-данные
  // через FK ON DELETE CASCADE (которые у нас НЕ настроены — гость просто
  // удалится из users, остальные таблицы остаются «orphan» и не мешают).
  rpc CleanupExpiredGuests(CleanupExpiredGuestsRequest) returns (CleanupExpiredGuestsResponse);
}

// RegisterRequest содержит данные для регистрации
message RegisterRequest {
  string email = 1;
  string password = 2;
  string username = 3;
}

// RegisterResponse содержит результат регистрации
message RegisterResponse {
  string user_id = 1;
}

// LoginRequest содержит данные для входа
message LoginRequest {
  string email = 1;
  string password = 2;
}

// LoginResponse содержит токены доступа
message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

// ValidateTokenRequest содержит токен для проверки
message ValidateTokenRequest {
  string token = 1;
}

// ValidateTokenResponse содержит результат проверки токена
message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
  bool is_guest = 4;  // true для guest JWT (см. CreateGuestSession)
}

// RefreshTokenRequest содержит refresh token
message RefreshTokenRequest {
  string refresh_token = 1;
}

// RefreshTokenResponse содержит новый access token
message RefreshTokenResponse {
  string access_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

// GetUserInfoRequest содержит ID пользователя
message GetUserInfoRequest {
  string user_id = 1;
}

// GetUserInfoResponse содержит информацию о пользователе
message GetUserInfoResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
}

// ListUsersRequest запрос на получение списка пользователей
message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
  string search = 3; // Search by email or full_name
  string role = 4; // Filter by role: "admin", "instructor", "student"
}

// ListUsersResponse ответ со списком пользователей
message ListUsersResponse {
  repeated UserInfo users = 1;
  int32 total = 2;
}

// UserInfo информация о пользователе
message UserInfo {
  string id = 1;
  string email = 2;
  string username = 3;
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
}

// UpdateUserRoleRequest запрос на обновление роли пользователя
message UpdateUserRoleRequest {
  string user_id = 1;
  string role = 2;
}

// UpdateUserRoleResponse ответ с обновленным пользователем
message UpdateUserRoleResponse {
  UserInfo user = 1;
}

// DeleteUserRequest запрос на удаление пользователя
message DeleteUserRequest {
  string user_id = 1;
}

// DeleteUserResponse ответ об удалении пользователя
message DeleteUserResponse {}

// SearchByUsernameRequest — поиск по префиксу username.
message SearchByUsernameRequest {
  string query = 1;       // Префикс username (мин 2 символа).
  int32 limit = 2;        // Default 20, max 50.
  string exclude_user_id = 3; // Опционально — исключить из выдачи (обычно self).
}

// SearchByUsernameResponse — найденные пользователи.
message SearchByUsernameResponse {
  repeated UserInfo users = 1;
}

// === Guest mode (onboarding-spec.md §3.2) ===

// CreateGuestSessionRequest — bootstrap анонимного юзера.
message CreateGuestSessionRequest {
  // device_id — UUID v4, генерируется клиентом и хранится локально.
  // Используется для идемпотентности: один device = один guest user.
  string device_id = 1;
}

// CreateGuestSessionResponse — JWT для гостя + его user_id.
message CreateGuestSessionResponse {
  string user_id      = 1;
  string access_token = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp expires_at = 4;
  // true если guest user был создан в этом вызове, false если переиспользован
  // существующий (idempotent на тот же device_id).
  bool created = 5;
}

// ClaimGuestAccountRequest — конвертация гостя в registered user.
// user_id извлекается из guest JWT (caller передаёт его как контекстный
// guest_user_id; gateway/middleware валидирует совпадение).
message ClaimGuestAccountRequest {
  string guest_user_id = 1;
  string email         = 2;
  string password      = 3;
  string username      = 4;
}

// ClaimGuestAccountResponse — новые credentials и токены.
// user_id равен guest_user_id из request (preserve).
message ClaimGuestAccountResponse {
  string user_id       = 1;
  string access_token  = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// CleanupExpiredGuestsRequest — параметры cron-cleanup'а.
message CleanupExpiredGuestsRequest {
  // Минимальный возраст guest user для удаления (default 90 если 0).
  int32 cutoff_days = 1;
}

// CleanupExpiredGuestsResponse — сколько гостей удалено.
message CleanupExpiredGuestsResponse {
  int32 deleted_count = 1;
}
