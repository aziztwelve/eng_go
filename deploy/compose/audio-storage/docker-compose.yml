services:
  audio-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: elearning-audio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9010}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - audio_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - elearning-net

  audio-minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: elearning-audio-minio-init
    depends_on:
      audio-minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    entrypoint: >
      /bin/sh -ec '
      mc alias set audio http://audio-minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
      mc mb audio/audio --ignore-existing;
      mc anonymous set download audio/audio;
      '
    networks:
      - elearning-net

volumes:
  audio_minio_data:

networks:
  elearning-net:
    name: elearning-net
    external: true
