services:
  postgres:
    image: postgres:16-alpine
    container_name: elearning-postgres
    
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    
    ports:
      - "${POSTGRES_PORT}:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    restart: unless-stopped
    
    networks:
      - elearning-net

  # Phase 4 — Redis для leaderboard sorted sets (social-service)
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: elearning-redis

    # Redis 7.4.9 crashes while forking RDB snapshots on this host. AOF keeps
    # persistence without the failing background-save path.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]

    volumes:
      - redis_data:/data

    ports:
      - "${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - elearning-net

  # Phase 4 — Redpanda (Kafka API совместимый брокер) для xp.gained events
  # Single-binary, без Zookeeper. На prod миграция на managed Kafka.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: elearning-redpanda

    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn

    ports:
      - "${KAFKA_PORT:-19092}:19092"     # Kafka API (host)
      - "18081:18081"                    # Schema Registry
      - "18082:18082"                    # Pandaproxy (REST)

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - elearning-net

volumes:
  postgres_data:
  redis_data:
  redpanda_data:

networks:
  elearning-net:
    name: elearning-net
    external: false
